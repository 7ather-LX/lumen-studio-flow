appId: studio.lumen.flow
productName: Lumen Studio Flow
copyright: Copyright 2026 Lumen Studio Flow contributors
asar: true
directories:
  output: ../release
  buildResources: .
files:
  - main.cjs
  - preload.cjs
  - detail-workflow.cjs
  - package.json
  - renderer/**/*
win:
  icon: icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: Lumen-Studio-Flow-${version}.${ext}
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lumen Studio Flow
  artifactName: Lumen-Studio-Flow-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

electronDist: F:\\DSH WORKSPACE\\node_modules\\electron\\dist

extraResources:
  - from: bootstrap_runtime.ps1
    to: bootstrap_runtime.ps1
  - from: runtime-plugins
    to: runtime-plugins
  - from: icon.ico
    to: icon.ico
  - from: detect-pose.py
    to: detect-pose.py
  - from: region-erase.py
    to: region-erase.py
  - from: crop-single.py
    to: crop-single.py
  - from: count-people.py
    to: count-people.py
  - from: parsing
    to: parsing
